apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: test-pod-httproute
  namespace: test
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - test-pod.chrobacik.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: test-pod-svc
          namespace: test
          port: 80
          weight: 1

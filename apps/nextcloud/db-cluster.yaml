apiVersion: v1
kind: Secret
metadata:
  name: db-cluster-secret
type: kubernetes.io/basic-auth
stringData:
  username: nextcloud
  password: my-strong-password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db-cluster
spec:
  instances: 1
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      secret:
        name: db-cluster-secret
  storage:
    size: 1Gi
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-cert
  namespace: monitoring
spec:
  secretName: chrobacik-cloud-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - alertmanager.chrobacik.cloud
    - grafana.chrobacik.cloud
    - prometheus.chrobacik.cloud

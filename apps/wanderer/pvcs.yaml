apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wanderer-search-data
  namespace: wanderer
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

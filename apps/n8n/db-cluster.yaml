apiVersion: v1
kind: Secret
metadata:
  name: db-cluster-secret
  namespace: n8n
stringData:
  username: n8n
  password: my-strong-password
  postgres-password: my-strong-password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db-cluster
  namespace: n8n
spec:
  instances: 2
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: db-cluster-secret
  storage:
    size: 1Gi
    storageClass: longhorn
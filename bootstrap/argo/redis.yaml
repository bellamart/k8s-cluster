apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 25.3.2
    helm:
      values: |
        auth:
          enabled: false
          sentinel: false
        master:
          persistence:
            enabled: true
            storageClass: longhorn
            accessModes:
              - ReadWriteMany
            size: 8Gi
        metrics:
          enabled: true
        replica:
          replicaCount: 2
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: pihole-system
  sources:
    - repoURL: git@github.com:bellamart/k8s-cluster.git
      targetRevision: main
      path: apps/pihole
    - repoURL: https://mojo2600.github.io/pihole-kubernetes
      chart: pihole
      targetRevision: 2.38.0
      helm:
        values: |
          persistentVolumeClaim:
            enabled: true
            storageClass: longhorn
            accessModes:
              - ReadWriteMany
  
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - pihole.chrobacik.cloud
            tls:
              - secretName: chrobacik-cloud-tls
                hosts:
                  - pihole.chrobacik.cloud
  
          serviceWeb:
            loadBalancerIP: 192.168.1.250
            annotations:
              metallb.universe.tf/allow-shared-ip: pihole-svc
            type: LoadBalancer
  
          serviceDns:
            loadBalancerIP: 192.168.1.250
            annotations:
              metallb.universe.tf/allow-shared-ip: pihole-svc
            type: LoadBalancer

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
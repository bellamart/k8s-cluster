apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: git@github.com:bellamart/k8s-cluster.git
      targetRevision: main
      path: apps/monitoring
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 81.6.0
      helm:
        values: |
          grafana:
            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - grafana.chrobacik.cloud
              tls:
                - secretName: chrobacik-cloud-tls
                  hosts:
                    - grafana.chrobacik.cloud
            admin:
              existingSecret: grafana-admin-credentials
  
          prometheus:
            admin:
              existingSecret: grafana-admin-credentials
            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - prometheus.chrobacik.cloud
              tls:
                - secretName: chrobacik-cloud-tls
                  hosts:
                    - prometheus.chrobacik.cloud
            prometheusSpec:
              retention: 7d
              retentionSize: "15GiB"
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: longhorn
                    accessModes: ["ReadWriteMany"]
                    resources:
                      requests:
                        storage: 25Gi
              enableOTLPReceiver: true
  
          alertmanager:
            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - alertmanager.chrobacik.cloud
              tls:
                - secretName: chrobacik-cloud-tls
                  hosts:
                    - alertmanager.chrobacik.cloud

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2

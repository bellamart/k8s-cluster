apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  sources:
    - repoURL: git@github.com:bellamart/k8s-cluster.git
      targetRevision: main
      path: apps/n8n
    - repoURL: https://community-charts.github.io/helm-charts
      chart: n8n
      targetRevision: 1.24.33
      helm:
        values: |
          existingEncryptionKeySecret: n8n-encryption-key-secret
  
          log:
            level: warn
  
          db:
            type: postgresdb
  
          externalPostgresql:
            host: n8n-db-cluster-rw
            database: n8n
            username: n8n
            existingSecret: db-cluster-secret
  
          ingress:
            enabled: true
            className: traefik
            hosts:
              - host: n8n.chrobacik.cloud
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: chrobacik-cloud-tls
                hosts:
                  - n8n.chrobacik.cloud
  
          webhook:
            url: https://n8n.chrobacik.cloud
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
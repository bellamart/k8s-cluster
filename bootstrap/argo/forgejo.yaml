apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  sources:
    - repoURL: git@github.com:bellamart/k8s-cluster.git
      targetRevision: main
      path: apps/forgejo
    - repoURL: oci://code.forgejo.org/forgejo-helm/forgejo
      chart: forgejo
      targetRevision: 17.1.4
      helm:
        values: |
          persistence:
            enabled: true
            storageClass: longhorn
  
          ingress:
            enabled: true
            className: traefik
            hosts:
              - host: forgejo.chrobacik.cloud
                paths:
                  - path: /
                    pathType: Prefix
                    port: http
            tls:
              - secretName: chrobacik-cloud-tls
                hosts:
                  - forgejo.chrobacik.cloud
  
          gitea:
            admin:
              existingSecret: forgejo-admin-secret
            config:
              database:
                DB_TYPE: postgres
                HOST: forgejo-db-cluster-rw.forgejo.svc.cluster.local
                NAME: forgejo
                USER: forgejo
                PASSWD: my-strong-password
            queue:
              TYPE: redis
              CONN_STR: redis://redis-headless.redis.svc:6379/0?
            cache:
              ADAPTER: redis
              HOST: redis://redis-headless.redis.svc:6379/1
            session:
              PROVIDER: redis
              PROVIDER_CONFIG: redis://redis-headless.redis.svc:6379/2
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
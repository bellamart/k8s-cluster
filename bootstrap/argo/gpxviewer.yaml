apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpxviewer
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: gpxviewer
  sources:
    - repoURL: git@github.com:bellamart/k8s-cluster.git
      targetRevision: main
      path: apps/gpxviewer
    - repoURL: https://forgejo.chrobacik.cloud/martin/gpx-viewer
      targetRevision: v0.0.6
      path: chart/gpxviewer
      helm:
        values: |
          imagePullSecrets:
            - name: forgejo-registry-secret

          ingress:
            enabled: true
            className: traefik
            host: gpxviewer.chrobacik.cloud
            tls:
              - secretName: chrobacik-cloud-tls
                hosts:
                  - gpxviewer.chrobacik.cloud

          backend:
            image:
              tag: v0.0.6

            env:
              - name: SPRING_PROFILES_ACTIVE
                value: prod
              - name: SPRING_DATASOURCE_URL
                value: jdbc:postgresql://gpxviewer-db-cluster-rw.gpxviewer.svc.cluster.local:5432/gpxviewer
              - name: S3_ENDPOINT_URL
                value: https://minio.chrobacik.cloud
              - name: S3_REGION_NAME
                value: eu-central-1
              - name: S3_ACTIVITIES_BUCKET_NAME
                value: activities
              - name: STRAVA_REDIRECT_URI
                value: https://gpxviewer.chrobacik.cloud/api/v1/strava/callback
              - name: KEYCLOAK_HOST
                value: keycloak.chrobacik.cloud
              - name: S3_ENDPOINT_URL
                value: https://garage.chrobacik.cloud
              - name: S3_REGION_NAME
                value: garage
              - name: S3_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    key: S3_ACCESS_KEY
                    name: s3-credentials
              - name: S3_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    key: S3_SECRET_KEY
                    name: s3-credentials
              - name: SPRING_DATASOURCE_USERNAME
                valueFrom:
                  secretKeyRef:
                    key: SPRING_DATASOURCE_USERNAME
                    name: db-credentials
              - name: SPRING_DATASOURCE_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: SPRING_DATASOURCE_PASSWORD
                    name: db-credentials
              - name: KEYCLOAK_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    key: KEYCLOAK_CLIENT_ID
                    name: keycloak-credentials
              - name: KEYCLOAK_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    key: KEYCLOAK_CLIENT_SECRET
                    name: keycloak-credentials
          frontend:
            image:
                tag: v0.0.6

            # Leave empty when ingress routes /api to the backend on the same host
            apiBaseUrl: ""
            mapyComApiKey:
              existingSecret: mapy-secret
              key: MAPY_COM_API_KEY

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
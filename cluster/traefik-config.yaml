apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: true
      listeners:
        web:
          namespacePolicy:
            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          namespacePolicy:
            from: All
          certificateRefs:
            - name: chrobacik-cloud-tls
              namespace: kube-system
          mode: Terminate
    api:
      dashboard: true
      insecure: true
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
          - websecure
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        http3:
          enabled: true
          advertisedPort: 443
        tls:
          enabled: true
    tlsOptions:
      default:
        minVersion: VersionTLS12
        # HTTP/3 requires TLS 1.3, which is enabled by default in Traefik when HTTP/3 is on.
        # But having a clean default config helps.
    metrics:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          additionalLabels: 
            release: monitoring-helm

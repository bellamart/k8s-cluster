apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tools-helm
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
  source:
    repoURL: https://charts.jeffresc.dev
    chart: it-tools
    targetRevision: 0.1.4
    helm:
      values: |
        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: tools.chrobacik.cloud
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: chrobacik-cloud-tls
              hosts:
                - tools.chrobacik.cloud
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
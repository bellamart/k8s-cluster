apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole-helm
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: pihole-system
  source:
    repoURL: https://mojo2600.github.io/pihole-kubernetes
    chart: pihole
    targetRevision: 2.34.0
    helm:
      values: |
        DNS1: 192.168.1.1
        DNS2: 192.168.1.1

        persistentVolumeClaim:
          enabled: true
          storageClass: longhorn

        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - pihole.chrobacik.cloud
          tls:
            - secretName: chrobacik-cloud-tls
              hosts:
                - pihole.chrobacik.cloud

        serviceWeb:
          loadBalancerIP: 192.168.1.250
          annotations:
            metallb.universe.tf/allow-shared-ip: pihole-svc
          type: LoadBalancer

        serviceDns:
          loadBalancerIP: 192.168.1.250
          annotations:
            metallb.universe.tf/allow-shared-ip: pihole-svc
          type: LoadBalancer

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
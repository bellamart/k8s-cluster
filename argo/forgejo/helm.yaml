apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-helm
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  source:
    repoURL: oci://code.forgejo.org/forgejo-helm/forgejo
    chart: forgejo
    targetRevision: 16.2.1
    helm:
      values: |
        persistence:
          enabled: true
          storageClass: longhorn

        ingress:
          enabled: true
          className: traefik
          hosts:
            - host: forgejo.chrobacik.cloud
              paths:
                - path: /
                  pathType: Prefix
                  port: http
          tls:
            - secretName: chrobacik-cloud-tls
              hosts:
                - forgejo.chrobacik.cloud

        gitea:
          admin:
            existingSecret: forgejo-admin-secret
          config:
            database:
              DB_TYPE: postgres
              HOST: forgejo-db-cluster-rw.forgejo.svc.cluster.local
              NAME: forgejo
              USER: forgejo
              PASSWD: my-strong-password
          queue:
            TYPE: redis
            CONN_STR: redis://redis-helm-headless.redis.svc:6379/0?
          cache:
            ADAPTER: redis
            HOST: redis://redis-helm-headless.redis.svc:6379/1
          session:
            PROVIDER: redis
            PROVIDER_CONFIG: redis://redis-helm-headless.redis.svc:6379/2

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud-helm
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  source:
    repoURL: https://nextcloud.github.io/helm
    chart: nextcloud
    targetRevision: 8.4.1
    helm:
      values: |
        nextcloud:
          host: nextcloud.chrobacik.cloud
          existingSecret:
            enabled: true
            secretName: user-secret
            usernameKey: username
            passwordKey: password
          configs:
            https.config.php: |-
              <?php
              $CONFIG = array (
                'overwrite.cli.url' => 'https://nextcloud.chrobacik.cloud',
                'overwriteprotocol' => 'https'
              );
            php.ini: |-
              upload_max_filesize = 16G
              post_max_size = 16G

        persistence:
          enabled: true
          storageClass: longhorn
          size: 500Gi

        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: nextcloud.chrobacik.cloud
          tls:
            - secretName: chrobacik-cloud-tls
              hosts:
                - nextcloud.chrobacik.cloud
          annotations:
            nginx.ingress.kubernetes.io/affinity: cookie
            nginx.ingress.kubernetes.io/proxy-body-size: 4G

        internalDatabase:
          enabled: false

        externalDatabase:
          enabled: true
          type: postgresql
          host: nextcloud-db-cluster-rw.nextcloud.svc.cluster.local
          existingSecret:
            enabled: true
            secretName: db-cluster-secret
            usernameKey: username
            passwordKey: password

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
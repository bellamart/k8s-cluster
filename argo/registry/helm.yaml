apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry-helm
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: registry
  source:
    repoURL: https://helm.twun.io
    chart: docker-registry
    targetRevision: 3.0.0
    helm:
      values: |
        replicaCount: 1

        persistence:
          enabled: true
          size: 1Gi
          deleteEnabled: true

        secrets:
          # user: reg
          # password: pass
          htpasswd: reg:$2y$05$RRfMXUKXALfgY9A8khRVD.PDixgAsc/9I3rc71wCX2Ln6tv4w270S

        service:
          port: 443

        ingress:
          enabled: true
          className: nginx
          hosts:
            - registry.chrobacik.cloud
          tls:
            - secretName: chrobacik-cloud-tls
              hosts:
                - registry.chrobacik.cloud

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
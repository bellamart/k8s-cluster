apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-pod
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: test
  source:
    repoURL: git@github.com:bellamart/k8s-cluster.git
    targetRevision: feature/test-pod
    path: apps/test-pod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
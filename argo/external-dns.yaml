apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-pihole
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: pihole-system
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: 1.20.0
  helm:
    values: |
      provider:
        name: pihole
      extraEnvVars:
        - name: EXTERNAL_DNS_PIHOLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pihole-helm-password
              key: password
        - name: EXTERNAL_DNS_PIHOLE_SERVER
          value: http://pihole-web.pihole-system.svc.cluster.local
      serviceAccount:
        create: true
        name: external-dns
  syncPolicy:
    syncOptions:
        - CreateNamespace=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2